apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: uhc-agent/frontend:latest
        ports:
        - containerPort: 8501
        env:
        - name: VALIDATION_URL
          value: "http://validation-agent:5002"
        - name: MONITORING_URL
          value: "http://monitoring-agent:5006"
        - name: AUTH_URL
          value: "http://auth-service:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8501
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uhc-ingress
spec:
  rules:
  - host: uhc-agent.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

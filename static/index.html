<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHC Prior Auth Agent</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Prior Authorization Agent</h1>
        <p style="text-align: center; color: #666;">Autonomous AI Connector for UHC Eligibility & Benefits</p>
        
        <div class="agent-card">
            <div class="form-group">
                <label for="memberId">Member ID</label>
                <input type="text" id="memberId" value="123456789" placeholder="Enter Member ID">
            </div>
            
            <div class="form-group">
                <label for="cptCode">Procedure Code (CPT)</label>
                <select id="cptCode">
                    <option value="70450">70450 - CT Head/Brain (Requires PA)</option>
                    <option value="99213">99213 - Office Visit (No PA)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="diagnosisCode">Diagnosis Code</label>
                <input type="text" id="diagnosisCode" value="R51" placeholder="ICD-10 Code">
            </div>

            <div class="form-group">
                <label for="clinicalNotes">Clinical Documentation (Notes)</label>
                <textarea id="clinicalNotes" rows="4" placeholder="Enter clinical history, symptoms, and previous treatments..."></textarea>
                <small style="color: #666;">Try entering "Short" to trigger Gap Analysis, or a detailed note for Approval.</small>
            </div>

            <button id="submit-btn" onclick="submitRequest()">Run Agent Analysis</button>
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p style="text-align: center;">Agents are analyzing clinical data...</p>
        </div>

        <div id="status-area">
            <div id="results" class="result-box">
                <h3 id="result-header" style="margin-top: 0;">Status</h3>
                <p id="result-body" style="white-space: pre-wrap;"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

name: UHC Agent CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Pylint
      run: |
        echo "Running static analysis..."
        pylint src/ --exit-zero # Exit zero to not fail the build for now, but show the issues
  
  docker-build:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [validation, planner, denial, fhir, edi, monitoring, explanation, auth, frontend]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: src/infrastructure/docker/Dockerfile.${{ matrix.service }}
        push: false
        tags: uhc-agent/${{ matrix.service }}:latest

  deploy-to-huggingface:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Remove Binary Files
        run: |
          git rm --cached "src/agents/denial_prediction_agent/model.pkl"
          git rm --cached "Agentic AI Connector for UHC Prior Authorization API.pdf"
          git commit -m "Remove binary files for HF Spaces deployment"
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://SaifuddinHanif:$HF_TOKEN@huggingface.co/spaces/SaifuddinHanif/UHC-Auth-Prior-Prototype-Agent HEAD:main
